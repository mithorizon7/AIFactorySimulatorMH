name: Production core canary

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-core-canary
  cancel-in-progress: false

jobs:
  canary:
    if: vars.PRODUCTION_CANARY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ vars.PRODUCTION_CANARY_ORIGIN }}
      EXPECTED_BUILD_SHA: ${{ vars.PRODUCTION_CANARY_BUILD_SHA }}
      EXPECTED_RULESET_VERSION: ${{ vars.PRODUCTION_CANARY_RULESET_VERSION }}
      EXPECTED_MIGRATION_VERSION: ${{ vars.PRODUCTION_CANARY_MIGRATION_VERSION }}
      EXPECTED_MIGRATION_CHECKSUM: ${{ vars.PRODUCTION_CANARY_MIGRATION_CHECKSUM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Verify pinned Node and npm before dependency execution
        run: |
          npm run check:runtime
          test "$(npm --version)" = "10.9.9"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm exec -- playwright install --with-deps --only-shell chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/aifactory-canary-browsers
      - name: Startup, durable resume, completion and exact deployed identity
        run: node scripts/canary-production.mjs
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/aifactory-canary-browsers
      # No artifact upload: browser traces, snapshots, logs and credentials must
      # never be published. The runner emits an allowlisted status-only summary.

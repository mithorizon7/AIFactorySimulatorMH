name: Security And Regression Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-22
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified 2026-10-22
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:security
      - run: npm run test:tutorial
      - run: npm run build
      - run: npm run audit:security
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node tools/security-production-smoke.mjs

name: Release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Official library image index, inspected 2026-10-23; patched 16.15.
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run check:runtime
      - run: npm ci --ignore-scripts
      - run: npm run test:database
        env:
          # Synthetic ephemeral CI database, loopback only, never a provider URL.
          C_DB_TEST_ADMIN_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:55432/postgres
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Official Playwright1.64.1 Noble image, registry digest verified2026-10-26.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-22
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified 2026-10-22
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm run check:runtime
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run check:csp:dev
      - run: npm run test:tutorial
      - run: npm run test:unit
      - run: npm run test:persistence
      - run: npm run build
        env:
          BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
      - run: npm run test:api
      - run: npm run test:coverage
      - run: npm run check:bundle
      - run: npm audit --omit=dev --audit-level=high
      - name: Block critical full-tree advisories
        run: npm audit --audit-level=critical

      - name: Verify preinstalled pinned browser runtimes
        run: |
          node --input-type=module -e 'import { access } from "node:fs/promises"; import { chromium, firefox, webkit } from "@playwright/test"; for (const browser of [chromium, firefox, webkit]) await access(browser.executablePath()); console.log("Pinned browser executables verified");'

      - run: npm run test:e2e
      - run: npm run test:e2e:production
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
      - name: Verify strict-CSP accessibility in three browser engines
        run: npm exec -- playwright test --config=tests/config/accessibility.playwright.config.ts
      # Verification bundles remain private; do not upload browser artifacts
      # from this public repository. CI logs contain test outcomes only.
